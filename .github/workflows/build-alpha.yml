name: Build TechQuest alpha
on:
  workflow_dispatch:
  push:
    paths:
      - modlist.json
      - build_pack.py
      - compat/**
      - rpg-core/**
      - scripts/install_server.py
      - scripts/install_client.py
      - scripts/mods_transaction.py
      - scripts/audit_micro3_packages.py
      - windows-installer/**
      - scripts/security_audit.py
      - scripts/audit_jar_metadata.py
      - scripts/audit_keybinds.py
      - scripts/KeymapAudit.java
      - scripts/guide_assets.py
      - tests/**
      - .github/workflows/build-alpha.yml
permissions:
  contents: read
jobs:
  pack:
    name: Build pack and verify file hashes
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pack builder and server installer
        run: python -m unittest discover -s tests -v
      - name: Inspect official Iskander Rocket metadata
        run: python scripts/inspect_iskander_rocket.py
      - name: Validate GitHub-hosted IndustrialCraft JAR and download hash
        run: |
          python - <<'PY'
          import re
          import zipfile
          from pathlib import Path
          import build_pack
          manual=build_pack.manual_records(build_pack.load_cfg())
          if not manual:
              raise SystemExit("IndustrialCraft is required but missing")
          for item in manual:
              with zipfile.ZipFile(item["source_path"]) as jar:
                  metadata="\n".join(
                      jar.read(path).decode("utf-8", "replace")
                      for path in ("META-INF/neoforge.mods.toml","META-INF/mods.toml")
                      if path in jar.namelist())
                  if 'modId="ic2"' not in ''.join(metadata.split()) and "modId='ic2'" not in ''.join(metadata.split()):
                      raise SystemExit("Expected IC2 modId not present in JAR metadata")
              print("Checking GitHub raw pinned URL:", item["url"])
              data=build_pack.get_url(item["url"])
              build_pack.verify(data,item["hashes"])
              print("IC2 binary and raw download match:",item["filename"],len(data),"bytes")
          PY
      - name: Assemble client and server mods (temporary; do not redistribute)
        run: python build_pack.py
      - name: Audit micro3 client/server/Modrinth manifests and both Compatibility payloads
        run: python scripts/audit_micro3_packages.py
      - name: Assert pinned micro4 client, server and Modrinth manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path
          import build_pack

          cfg = build_pack.load_cfg()
          locks = cfg["modrinth_lock"]
          expected_ids = ("4QrnfueM", "XExdLWCQ", "LN9BxssP", "rOUBggPv")
          excluded_ids = ("x18RjbsF", "y16HgCOF", "p19vrgc2")
          excluded_names = ("colossal", "iskandert", "fusion", "ftb-industrial",
                            "ftb_industrial", "techquest-rpg-core", "pmmo")
          for project_id in excluded_ids:
              assert project_id not in locks, ("excluded Modrinth lock", project_id)
          for meta in locks.values():
              label = (meta.get("title", "") + " " + meta.get("filename", "")).lower()
              assert not any(name in label for name in excluded_names), label

          with zipfile.ZipFile("output/TechQuest_1.21.1_0.3.3_ALPHA.mrpack") as archive:
              assert archive.testzip() is None, "damaged mrpack ZIP"
              index = json.loads(archive.read("modrinth.index.json"))
              files = {row["path"]: row for row in index["files"]}
              all_paths = set(archive.namelist()) | set(files)
              # Only JARs under mod directories can be installed as mods.
              # Patchouli pages such as colossal_enemies.json are not reactor mods.
              def forbidden_mod_jar(path):
                  lowered = path.lower()
                  if not lowered.startswith(("mods/", "overrides/mods/")):
                      return False
                  if not lowered.endswith(".jar"):
                      return False
                  return any(name in Path(lowered).name for name in excluded_names)

              # Regression checks: keep false positives out and real banned JARs out.
              assert not forbidden_mod_jar(
                  "overrides/patchouli_books/techquest_guide/en_us/entries/colossal_enemies.json")
              assert forbidden_mod_jar("mods/colossal-reactors-1.0.jar")
              assert not forbidden_mod_jar("mods/iskander-2.0.1.jar")
              for path in all_paths:
                  assert not forbidden_mod_jar(path), path
              for project_id in expected_ids:
                  lock = locks[project_id]
                  name = lock["filename"]
                  path = "mods/" + name
                  assert path in files, ("missing from mrpack", project_id, path)
                  row = files[path]
                  assert row["hashes"]["sha512"] == lock["sha512"], path
                  assert row["env"] == {"client": "required", "server": "required"}, path
                  # .mrpack holds download references, never repacked third-party JARs.
                  assert "overrides/" + path not in all_paths, path
                  for side in ("client", "server"):
                      jar = Path("output") / side / "mods" / name
                      assert jar.is_file(), (side, project_id, "missing")
                      assert hashlib.sha512(jar.read_bytes()).hexdigest() == lock["sha512"], jar
              assert "overrides/mods/techquest-compat-1.0.0.jar" in all_paths
          for side in ("client", "server"):
              directory = Path("output") / side / "mods"
              assert (directory / "techquest-compat-1.0.0.jar").is_file(), side
              assert not any(
                  any(name in jar.name.lower() for name in excluded_names)
                  for jar in directory.glob("*.jar")
              ), side
          print("micro4 pinned JAR hashes, client/server outputs and mrpack verified")
          print("No Minecraft gameplay or route-testing implied by this check")
          PY
      - name: Verify original Iskander in client, server, and Modrinth manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path
          import build_pack

          cfg = build_pack.load_cfg()
          mod = next(x for x in cfg["mods"] if x["project"] == "iskander-rocket-mod")
          lock = cfg["modrinth_lock"]["XUogRnhj"]
          assert mod["version_id"] == lock["version_id"] == "M1b2lYax"
          assert lock["filename"] == "iskander-2.0.1+mc1.21-1.21.1-neoforge.jar"
          assert lock["environment"] == {"client": "required", "server": "required"}
          for side in ("client", "server"):
              jar = Path("output") / side / "mods" / lock["filename"]
              assert jar.is_file(), (side, "Iskander missing")
              assert hashlib.sha512(jar.read_bytes()).hexdigest() == lock["sha512"], jar
              with zipfile.ZipFile(jar) as archive:
                  assert archive.testzip() is None, (side, "corrupted jar")
          with zipfile.ZipFile("output/TechQuest_1.21.1_0.3.3_ALPHA.mrpack") as archive:
              assert archive.testzip() is None
              index = json.loads(archive.read("modrinth.index.json"))
              path = "mods/" + lock["filename"]
              rows = [row for row in index["files"] if row["path"] == path]
              assert len(rows) == 1, (path, "expected exactly one original mod entry")
              assert rows[0]["hashes"]["sha512"] == lock["sha512"]
              assert rows[0]["env"] == {"client": "required", "server": "required"}
              assert "overrides/" + path not in archive.namelist(), "do not repackage author jar"
              guide = "overrides/patchouli_books/techquest_guide/en_us/entries/iskander_rocket.json"
              assert guide in archive.namelist(), "missing Patchouli rocket guide"
          print("micro5: Iskander 2.0.1 original pinned SHA-512 and client/server mrpack verified")
          PY
      - name: Check built JAR game ranges and required mod presence
        run: python scripts/audit_jar_metadata.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Audit observed key defaults and the Z zoom plan
        run: python scripts/audit_keybinds.py
      - name: Create server bootstrap (no redistributed third-party JARs)
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          out=Path("output")
          p=out/"TechQuest_Server_Bootstrap.zip"
          readme="""TechQuest server bootstrap — Minecraft 1.21.1 / NeoForge / Java 21

          1. Install Java 21 (64-bit) and Python 3.9+.
          2. In this extracted folder, run:
               python scripts/install_server.py --pack TechQuest.mrpack --target server
          3. Industrial Craft 2: Nostalgia is included automatically in TechQuest.mrpack
             as a pinned GitHub download with SHA-512/SHA-1 verification.
             You do NOT need to add its JAR manually. The same mod goes to client/server.
          4. Read Minecraft's EULA and change eula.txt to eula=true only if you agree.
          5. Set whitelist players with /whitelist add <username> using server console.
          6. Run ./run.sh nogui on Linux or run.bat nogui on Windows.

          Current pack is an untested alpha. Back up worlds, review logs.
          """
          with zipfile.ZipFile(p,"w",zipfile.ZIP_DEFLATED) as z:
              z.write("scripts/install_server.py")
              z.write("scripts/mods_transaction.py")
              z.write("build_pack.py")
              z.write("scripts/guide_assets.py")
              z.write(out/"TechQuest_1.21.1_0.3.3_ALPHA.mrpack",arcname="TechQuest.mrpack")
              z.writestr("SERVER_INSTALL_README.txt",readme)
          print("Created",p,p.stat().st_size,"bytes")
          PY
      - name: Create optional official Launcher command-line bootstrap
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          out=Path("output")
          readme="""TECHQUEST 0.3.3 ALPHA — Minecraft Official Launcher

          Non-technical Windows players should use TechQuestInstaller.exe GUI
          from the Windows GUI artifact instead. This ZIP is an optional
          backup for developers using Python, not needed by ordinary players.

          Needs Minecraft Java 1.21.1, NeoForge 21.1.264, Java 21.
          From this folder:
            python scripts/install_client.py --pack TechQuest_Optimized.mrpack --game-dir C:\\Minecraft\\TechQuestOptimized

          Then set Official Minecraft Launcher -> NeoForge -> Game Directory
          to the same dedicated game folder. Never mix with vanilla/Fabric mods.
          """
          with zipfile.ZipFile(out/"TechQuest_Client_Bootstrap.zip","w",
                               zipfile.ZIP_DEFLATED) as z:
              z.write("scripts/install_client.py")
              z.write("scripts/mods_transaction.py")
              z.write("build_pack.py")
              z.write("scripts/guide_assets.py")
              z.write(out/"TechQuest_1.21.1_0.3.3_ALPHA.mrpack",arcname="TechQuest_Optimized.mrpack")
              z.writestr("OFFICIAL_LAUNCHER_INSTALL.txt", readme)
          PY
      - name: Test both extracted bootstrap archives in isolation
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile, zipfile
          from pathlib import Path
          env = dict(os.environ)
          env.pop("PYTHONPATH", None)
          for kind in ("Client", "Server"):
              with tempfile.TemporaryDirectory() as folder:
                  root = Path(folder)
                  with zipfile.ZipFile(f"output/TechQuest_{kind}_Bootstrap.zip") as archive:
                      archive.extractall(root)
                  script = root / "scripts" / f"install_{kind.lower()}.py"
                  pack = next(root.glob("*.mrpack"))
                  target = root / "test-install"
                  flag = "--game-dir" if kind == "Client" else "--target"
                  subprocess.run([sys.executable, str(script), "--pack", str(pack),
                                  flag, str(target), "--dry-run"],
                                 cwd=root, env=env, check=True)
                  assert not target.exists(), "Dry-run modified the installation directory"
          PY
      - name: Publish downloadable manifests and bootstrap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TechQuest-1.21.1-alpha-build
          path: |
            output/*.mrpack
            output/TechQuest_Server_Bootstrap.zip
            output/TechQuest_Client_Bootstrap.zip
            output/versions-lock.json
            output/BUILD_STATUS.json
            output/micro3-package-audit.json
            output/jar-metadata-audit.json
            output/keybindings-audit.json
            output/keybindings-audit.md
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize build
        if: always()
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          out=Path("output")
          lines=["# TechQuest alpha build", ""]
          if (out/"versions-lock.json").exists():
              d=json.loads((out/"versions-lock.json").read_text(encoding="utf-8"))
              lines.append(f"- Resolved mods and dependencies: **{len(d.get('mods',[]))}**")
              lines.append(f"- Optional mods skipped: **{len(d.get('optional_skipped',[]))}**")
          if (out/"BUILD_STATUS.json").exists():
              j=json.loads((out/"BUILD_STATUS.json").read_text(encoding="utf-8"))
              lines.append(f"- Build status: **{j['status']}**")
              lines.append(f"- Manual mods missing: **{', '.join(j['missing_mods']) or 'none'}**")
          else:
              lines.append("- Full download/hash verification failed or did not finish; inspect logs.")
          lines.append("- One optimized client profile: Sodium, ImmediatelyFast, More Culling, BadOptimizations, Dynamic FPS.")
          lines.append("- All gameplay mods are preserved. Iris/shader loader removed from default package.")
          lines.append("- Both client and server continue to use the same game-changing mods.")
          lines += ["","**Not a tested playable release.** No Minecraft client/server runtime startup was performed.",
                    "IndustrialCraft 2 Nostalgia is included as a verified download URL inside .mrpack.",
                    "Third-party JAR bytes are referenced via pinned GitHub URL, not bundled in the artifact.",
                    "Look under this run's **Artifacts** for .mrpack and server bootstrap."]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          PY

  windows-installer:
    name: Build self-contained GUI installer (Windows)
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Get the alpha pack from this workflow
        uses: actions/download-artifact@v4
        with:
          name: TechQuest-1.21.1-alpha-build
          path: client-packages
      - name: Embed single optimized client manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-installer/assets | Out-Null
          Copy-Item client-packages/TechQuest_1.21.1_0.3.3_ALPHA.mrpack windows-installer/assets/TechQuest_Optimized.mrpack
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("$PWD/windows-installer/assets/TechQuest_Optimized.mrpack")
          try {
            $entry = $zip.Entries | Where-Object FullName -EQ 'modrinth.index.json'
            if(-not $entry) { throw 'Invalid optimized pack' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $index = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Close() }
            $paths = @($index.files | ForEach-Object { $_.path })
            if($paths | Where-Object { $_ -match '^mods/(techquest-rpg-core|pmmo-|project-mmo)' }) {
              throw 'Disallowed RPG Core/PMMO in GUI Modrinth manifest'
            }
            if($zip.Entries | Where-Object { $_.FullName -match '^overrides/mods/(techquest-rpg-core|pmmo-|project-mmo)' }) {
              throw 'Disallowed RPG Core/PMMO in GUI overrides'
            }
            foreach ($mustHave in @('immediatelyfast','moreculling','badoptimizations','dynamic-fps','buildcraft','industrial-craft','xaero','healthindicator','patchouli','openloader')) {
              if(-not ($paths | Where-Object { $_ -match $mustHave })) { throw "Missing required mod: $mustHave" }
            }
            if($paths | Where-Object { $_ -match '^mods/iris-' }) { throw 'Optimized pack contains Iris unexpectedly' }
            if($index.versionId -ne '0.3.3-alpha') { throw "Unexpected version $($index.versionId)" }
            if(-not ($zip.Entries | Where-Object FullName -EQ 'overrides/options.txt')) { throw 'Missing low-lag video settings' }
            foreach ($required in @(
              'overrides/patchouli_books/techquest_guide/book.json',
              'overrides/patchouli_books/techquest_guide/en_us/entries/start.json',
              'overrides/config/openloader/packs/techquest_starter_guide.zip',
              'overrides/mods/techquest-compat-1.0.0.jar'
            )) {
              if(-not ($zip.Entries | Where-Object FullName -EQ $required)) { throw "Missing in-game book: $required" }
            }
          } finally { $zip.Dispose() }
      - name: Publish Windows x64 native GUI app
        shell: pwsh
        run: |
          dotnet publish windows-installer/TechQuestInstaller.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false --output dist
          if($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          if(-not (Test-Path dist/TechQuestInstaller.exe)) { throw 'Missing GUI executable' }
          Get-Item dist/TechQuestInstaller.exe | Select-Object Name,Length
      - name: Smoke-test compiled GUI EXE and optimized pack
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/TechQuestInstaller.exe).Path
          $run = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if($run.ExitCode -ne 0) { throw "GUI packaged resource self-test failed: $($run.ExitCode)" }
          Write-Host "Native installer unified optimized manifest verified"
      - name: Upload one-click graphical installer
        uses: actions/upload-artifact@v4
        with:
          name: TechQuest-Windows-GUI-Installer
          path: dist/TechQuestInstaller.exe
          if-no-files-found: error
          retention-days: 30

  security-scan:
    name: Security audit (ClamAV Optimized+EXE)
    needs: [pack, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact optimized manifest from this build
        uses: actions/download-artifact@v4
        with:
          name: TechQuest-1.21.1-alpha-build
          path: security-work/manifests
      - name: Download exact published Windows GUI EXE from this build
        uses: actions/download-artifact@v4
        with:
          name: TechQuest-Windows-GUI-Installer
          path: security-work/installer
      - name: Verify source, JAR integrity and every checksum
        run: |
          python scripts/security_audit.py \
            --pack security-work/manifests/TechQuest_1.21.1_0.3.3_ALPHA.mrpack \
            --mods-dir security-work/mods --reports security-work/reports
          test -s security-work/installer/TechQuestInstaller.exe
          sha256sum security-work/installer/TechQuestInstaller.exe | tee security-work/reports/windows-installer-sha256.txt
      - name: Install ClamAV antivirus and update signatures
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam
          clamscan --version | tee security-work/reports/clamav-version.txt
          test -n "$(find /var/lib/clamav -maxdepth 1 -type f \( -name 'daily.cvd' -o -name 'daily.cld' \) -print -quit)"
      - name: Antivirus scan all optimized client/server JARs and Windows EXE
        shell: bash
        run: |
          set +e
          clamscan --recursive --infected \
            --max-filesize=512M --max-scansize=2048M --max-recursion=20 \
            --max-files=10000 --log=security-work/reports/clamav-results.txt \
            security-work/mods security-work/installer/TechQuestInstaller.exe
          code=$?
          set -e
          printf 'ClamAV exit code: %s\n' "$code" | tee security-work/reports/clamav-exit-code.txt
          if [ "$code" -eq 0 ]; then
            echo "No malware signatures detected by ClamAV in scanned files." | tee -a security-work/reports/clamav-exit-code.txt
          elif [ "$code" -eq 1 ]; then
            echo "::error::ClamAV flagged at least one file as infected!"
            exit 1
          else
            echo "::error::Antivirus failed; scan is NOT verified or clean."
            exit 2
          fi
      - name: Publish transparent security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TechQuest-Security-Audit
          path: security-work/reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Security scan summary
        if: always()
        shell: bash
        run: |
          echo "## TechQuest malware scan" >> "$GITHUB_STEP_SUMMARY"
          if [ -s security-work/reports/manifest-integrity.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          x=json.load(open("security-work/reports/manifest-integrity.json"))
          print(f"- Unique scanned-source JARs: {x['unique_jar_files']}")
          print(f"- Optimized package JARs: {x['pack_mods']}")
          print("- All JAR hash and ZIP-integrity checks succeeded.")
          PY
          else
            echo "- Integrity/source audit incomplete — do NOT call this safe." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s security-work/reports/clamav-exit-code.txt ]; then
            cat security-work/reports/clamav-exit-code.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ClamAV not completed. No antivirus clearance." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Negative antivirus scans cannot guarantee absence of malicious code." >> "$GITHUB_STEP_SUMMARY"

  publish-preview:
    # Historical micro2 publisher only; this branch never auto-publishes a release.
    name: Publish public installer preview (no account required)
    needs: [pack, windows-installer, security-scan]
    # Never publish unscanned binaries or make an unstable beta the stable release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/micro2-rpg-core-033'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: techquest-preview-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download the exact security-approved Windows installer
        uses: actions/download-artifact@v4
        with:
          name: TechQuest-Windows-GUI-Installer
          path: public
      - name: Download the exact verified modpack manifest
        uses: actions/download-artifact@v4
        with:
          name: TechQuest-1.21.1-alpha-build
          path: public/pack
      - name: Publish or update a public GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prevent an older successful CI run from replacing a newer preview.
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feat/micro2-rpg-core-033" --jq '.object.sha')
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated candidate $GITHUB_SHA; branch moved to $CURRENT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -s public/TechQuestInstaller.exe
          test -s public/pack/TechQuest_1.21.1_0.3.3_ALPHA.mrpack
          cp public/pack/TechQuest_1.21.1_0.3.3_ALPHA.mrpack public/TechQuest_Optimized.mrpack
          sha256sum public/TechQuestInstaller.exe public/TechQuest_Optimized.mrpack > public/SHA256SUMS.txt
          cat > public/NOTES.md <<EOF
          # TechQuest 0.3.3-micro2 preview

          Windows 10/11 x64, Minecraft Java 1.21.1, NeoForge 21.1.264.

          **Download TechQuestInstaller.exe without a GitHub account.**
          The EXE can create or update your existing TechQuest profile. New installs
          download several mods simultaneously; upgrades reuse unchanged JARs after
          checking their exact hashes. No Python or terminal required.

          Preview built from commit ${GITHUB_SHA}. SHA-256 checksums are attached.
          This release passed the pack build, Windows EXE self-test and ClamAV workflow.
          Project MMO has been replaced by the original TechQuest RPG Core; advancement perks and mob scaling require gameplay testing. The shared Apotheosis World Tier is **not yet multiplayer-tested**.
          Back up existing worlds. This is a prerelease, not a stable version.

          Third-party mods download only from their reviewed publishers;
          they are not bundled into this installer.
          EOF
          TAG="v0.3.3-micro2-preview"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" public/TechQuestInstaller.exe public/TechQuest_Optimized.mrpack public/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "TechQuest 0.3.3-micro2 (preview)" --notes-file public/NOTES.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
