name: Review technology additions metadata
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/inspect_tech_expansion.py
      - .github/workflows/review-tech-expansion.yml
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact NeoForge versions and all required dependencies
        run: python scripts/inspect_tech_expansion.py
