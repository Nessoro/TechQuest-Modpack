name: Probe official Refined Storage 2.0.9 metadata
on:
  pull_request:
    paths:
      - .github/workflows/refined-metadata-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Verify authoritative Modrinth version and print reviewed pin
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          url = "https://api.modrinth.com/v2/version/lHHiI26k"
          request = urllib.request.Request(url, headers={"User-Agent":"TechQuest-Modpack/0.3.3 (github.com/Nessoro/TechQuest-Modpack)"})
          with urllib.request.urlopen(request, timeout=30) as res:
              data = json.load(res)
          assert data["project_id"] == "KDvYkUg3", data["project_id"]
          assert data["id"] == "lHHiI26k"
          assert "neoforge" in data["loaders"], data["loaders"]
          assert "1.21.1" in data["game_versions"], data["game_versions"]
          mods = [x for x in data["files"] if x["filename"] == "refinedstorage-neoforge-2.0.9.jar"]
          assert len(mods) == 1, [f["filename"] for f in data["files"]]
          print("OFFICIAL_PROJECT_ID=" + data["project_id"])
          print("OFFICIAL_VERSION=" + data["version_number"])
          print("OFFICIAL_REF_SHA512=" + mods[0]["hashes"]["sha512"])
          print("OFFICIAL_REF_SHA1=" + mods[0]["hashes"]["sha1"])
          print("OFFICIAL_REF_FILE_SIZE=" + str(mods[0]["size"]))
          print("OFFICIAL_REF_DEPENDENCIES=" + json.dumps(data.get("dependencies",[])))
          PY
