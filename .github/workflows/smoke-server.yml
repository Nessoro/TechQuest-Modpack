name: Smoke-test TechQuest server with IC2 (opt-in)
on:
  workflow_dispatch:
    inputs:
      accept_minecraft_eula:
        description: 'I have read and agree to the Minecraft EULA for this temporary test server'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ inputs.accept_minecraft_eula == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare server mods including IndustrialCraft 2
        run: |
          python build_pack.py
          test -s output/server/mods/industrial-craft-2-nostalgia-21.1.0-local.26.jar
      - name: Install official NeoForge 21.1.259
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json;print(json.load(open("modlist.json"))["loader_version"])')
          url="https://maven.neoforged.net/releases/net/neoforged/neoforge/${version}/neoforge-${version}-installer.jar"
          mkdir -p smoke
          cp -r output/server/mods smoke/
          cp output/server/server.properties smoke/
          cd smoke
          curl -fsSL --retry 3 "$url" -o installer.jar
          curl -fsSL --retry 3 "$url.sha512" -o installer.jar.sha512
          expected=$(cut -d ' ' -f1 installer.jar.sha512)
          echo "$expected  installer.jar" | sha512sum --check
          java -jar installer.jar --installServer
          echo '-Xms2G' >> user_jvm_args.txt
          echo '-Xmx5G' >> user_jvm_args.txt
      - name: Boot and check logs (temporary test server)
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          printf "eula=true\n" > eula.txt
          bash ./run.sh nogui > startup.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 150); do
            if grep -Eq 'Done \(.*\)! For help' startup.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          tail -n 100 startup.log
          kill "$pid" 2>/dev/null || true
          if [ "$ready" -ne 1 ]; then
            echo "Server did not finish starting: examine artifact logs."
            exit 1
          fi
          echo "Server launched WITH IndustrialCraft 2: Nostalgia. Multiplayer testing still required."
      - name: Upload smoke-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TechQuest-neoforge-smoke-logs
          path: |
            smoke/startup.log
            smoke/logs/latest.log
            smoke/crash-reports/
            output/BUILD_STATUS.json
          if-no-files-found: warn
          retention-days: 14
