name: Verify official DimStorage and EdivadLib pins
on:
  push:
    paths:
      - .github/workflows/dimstorage-metadata-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch the official Modrinth version API
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          def get(path):
              url="https://api.modrinth.com/v2/"+path
              req=urllib.request.Request(url,headers={"User-Agent":"TechQuest-Modpack/0.3.3 (github.com/Nessoro/TechQuest-Modpack)"})
              with urllib.request.urlopen(req,timeout=30) as resp:return json.load(resp)
          v=get("version/R7rQFgQh")
          p=get("project/8lnmIJH7")
          assert v["project_id"]=="8lnmIJH7" and v["version_number"]=="9.1.1"
          assert "1.21.1" in v["game_versions"] and "neoforge" in v["loaders"]
          files=[f for f in v["files"] if f.get("primary")] or v["files"]
          assert len(files)==1,files
          f=files[0]
          print("DIMSTORAGE="+json.dumps({"project":v["project_id"],"version":v["version_number"],
              "version_id":v["id"],"filename":f["filename"],"sha512":f["hashes"]["sha512"],
              "sha1":f["hashes"]["sha1"],"size":f["size"],"dependencies":v.get("dependencies",[]),
              "license":p.get("license"),"client_side":p.get("client_side"),"server_side":p.get("server_side")}))
          required=[d for d in v.get("dependencies",[]) if d["dependency_type"]=="required"]
          print("REQUIRED="+json.dumps(required))
          for d in required:
              pid=d.get("project_id")
              if not pid and d.get("version_id"):pid=get("version/"+d["version_id"])["project_id"]
              assert pid, d
              p2=get("project/"+pid)
              vs=get("project/"+pid+"/version?"+urllib.parse.urlencode({
                  "loaders":json.dumps(["neoforge"]),"game_versions":json.dumps(["1.21.1"])
              }))
              releases=[v for v in vs if v["version_type"]=="release"]
              assert releases,(pid,"No release")
              for entry in sorted(releases,key=lambda x:x["date_published"],reverse=True)[:5]:
                  files=[f for f in entry["files"] if f.get("primary")] or entry["files"]
                  print("REQUIRED_CANDIDATE="+json.dumps({"project":pid,"name":p2["title"],
                      "id":entry["id"],"version":entry["version_number"],"published":entry["date_published"],
                      "filename":files[0]["filename"],"sha512":files[0]["hashes"]["sha512"],
                      "size":files[0]["size"],"dependencies":entry.get("dependencies",[]),
                      "client_side":p2.get("client_side"),"server_side":p2.get("server_side"),
                      "license":p2.get("license")}))
          PY
