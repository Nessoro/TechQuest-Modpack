name: Validate Pages website
on:
  push:
    paths:
      - docs/**
      - scripts/sync_site_mods.py
      - scripts/check_site_browser.py
      - .github/workflows/validate-site.yml
  pull_request:
    paths:
      - docs/**
      - scripts/sync_site_mods.py
      - scripts/check_site_browser.py
      - .github/workflows/validate-site.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check synchronized catalog and JavaScript
        run: |
          python scripts/sync_site_mods.py
          git diff --exit-code -- docs/index.html
          node --check docs/site.js
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test layout, catalog, forms and unavailable API
        run: python scripts/check_site_browser.py
      - name: Upload website screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TechQuest-website-preview
          path: output/site-preview/
          if-no-files-found: warn
