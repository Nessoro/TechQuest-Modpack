name: Verify NeoForge installer fallback
on:
  workflow_dispatch:
  push:
    paths:
      - windows-installer/**
      - tests/neoforge-bootstrap/**
      - scripts/check_neoforge_bootstrap.py
      - .github/workflows/test-installer.yml
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match committed download plan to pinned official installer
        run: python scripts/check_neoforge_bootstrap.py
      - name: Exercise GUI downloader with controlled failures
        run: dotnet run --project tests/neoforge-bootstrap/BootstrapTests.csproj --configuration Release
      - name: Verify real official sources and every dependency hash
        run: dotnet run --project tests/neoforge-bootstrap/BootstrapTests.csproj --configuration Release --no-build -- --probe-primary
      - name: Verify real fallback with Maven deliberately unavailable
        run: dotnet run --project tests/neoforge-bootstrap/BootstrapTests.csproj --configuration Release --no-build -- --probe-maven-outage
