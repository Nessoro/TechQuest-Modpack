name: Build TechQuest alpha
on:
  workflow_dispatch:
  push:
    paths:
      - modlist.json
      - build_pack.py
      - scripts/install_server.py
      - tests/**
      - .github/workflows/build-alpha.yml
permissions:
  contents: read
jobs:
  pack:
    name: Build pack and verify file hashes
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pack builder and server installer
        run: python -m unittest discover -s tests -v
      - name: Validate GitHub-hosted IndustrialCraft JAR and download hash
        run: |
          python - <<'PY'
          import re
          import zipfile
          from pathlib import Path
          import build_pack
          manual=build_pack.manual_records(build_pack.load_cfg())
          if not manual:
              raise SystemExit("IndustrialCraft is required but missing")
          for item in manual:
              with zipfile.ZipFile(item["source_path"]) as jar:
                  metadata="\n".join(
                      jar.read(path).decode("utf-8", "replace")
                      for path in ("META-INF/neoforge.mods.toml","META-INF/mods.toml")
                      if path in jar.namelist())
                  if 'modId="ic2"' not in ''.join(metadata.split()) and "modId='ic2'" not in ''.join(metadata.split()):
                      raise SystemExit("Expected IC2 modId not present in JAR metadata")
              print("Checking GitHub raw pinned URL:", item["url"])
              data=build_pack.get_url(item["url"])
              build_pack.verify(data,item["hashes"])
              print("IC2 binary and raw download match:",item["filename"],len(data),"bytes")
          PY
      - name: Assemble client and server mods (temporary; do not redistribute)
        run: python build_pack.py
      - name: Create server bootstrap (no redistributed third-party JARs)
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          out=Path("output")
          p=out/"TechQuest_Server_Bootstrap.zip"
          readme="""TechQuest server bootstrap — Minecraft 1.21.1 / NeoForge / Java 21

          1. Install Java 21 (64-bit) and Python 3.9+.
          2. In this extracted folder, run:
               python scripts/install_server.py --pack TechQuest.mrpack --target server
          3. Industrial Craft 2: Nostalgia is included automatically in TechQuest.mrpack
             as a pinned GitHub download with SHA-512/SHA-1 verification.
             You do NOT need to add its JAR manually. The same mod goes to client/server.
          4. Read Minecraft's EULA and change eula.txt to eula=true only if you agree.
          5. Set whitelist players with /whitelist add <username> using server console.
          6. Run ./run.sh nogui on Linux or run.bat nogui on Windows.

          Current pack is an untested alpha. Back up worlds, review logs.
          """
          with zipfile.ZipFile(p,"w",zipfile.ZIP_DEFLATED) as z:
              z.write("scripts/install_server.py")
              z.write("build_pack.py")
              z.write(out/"TechQuest_1.21.1_0.1.0.mrpack",arcname="TechQuest.mrpack")
              z.writestr("SERVER_INSTALL_README.txt",readme)
          print("Created",p,p.stat().st_size,"bytes")
          PY
      - name: Publish downloadable manifests and bootstrap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TechQuest-1.21.1-alpha-build
          path: |
            output/*.mrpack
            output/TechQuest_Server_Bootstrap.zip
            output/versions-lock.json
            output/BUILD_STATUS.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize build
        if: always()
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          out=Path("output")
          lines=["# TechQuest alpha build", ""]
          if (out/"versions-lock.json").exists():
              d=json.loads((out/"versions-lock.json").read_text(encoding="utf-8"))
              lines.append(f"- Resolved mods and dependencies: **{len(d.get('mods',[]))}**")
              lines.append(f"- Optional mods skipped: **{len(d.get('optional_skipped',[]))}**")
          if (out/"BUILD_STATUS.json").exists():
              j=json.loads((out/"BUILD_STATUS.json").read_text(encoding="utf-8"))
              lines.append(f"- Build status: **{j['status']}**")
              lines.append(f"- Manual mods missing: **{', '.join(j['missing_mods']) or 'none'}**")
          else:
              lines.append("- Full download/hash verification failed or did not finish; inspect logs.")
          lines += ["","**Not a tested playable release.** No Minecraft client/server runtime startup was performed.",
                    "IndustrialCraft 2 Nostalgia is included as a verified download URL inside .mrpack.",
                    "Third-party JAR bytes are referenced via pinned GitHub URL, not bundled in the artifact.",
                    "Look under this run's **Artifacts** for .mrpack and server bootstrap."]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          PY
