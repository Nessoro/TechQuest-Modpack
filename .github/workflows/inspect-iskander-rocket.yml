name: Inspect Iskander Rocket release metadata
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/inspect_iskander_rocket.py
      - .github/workflows/inspect-iskander-rocket.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official versions, download URLs, integrity and dependencies
        run: python scripts/inspect_iskander_rocket.py
