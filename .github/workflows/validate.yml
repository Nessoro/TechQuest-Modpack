name: Validate repository
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test project and builder
        run: |
          python -m unittest discover -s tests -v
          python build_pack.py --help

      - name: Probe official Quartz Arsenal release and JAR (temporary, no redistribution)
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          URL='https://api.modrinth.com/v2/version/toDdIhGu'
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'TechQuest-CI/0.3.3 (github.com/Nessoro/TechQuest-Modpack)'}), timeout=60).read()
          info=json.loads(get(URL))
          assert info['project_id']=='gnwGOmBf',info['project_id']
          assert 'neoforge' in info['loaders'], info['loaders']
          assert '1.21.1' in info['game_versions'], info['game_versions']
          assert info['version_number']=='1.0.8',info['version_number']
          print('QUARTZ_VERSION_ID='+info['id'])
          print('QUARTZ_VERSION_NUMBER='+info['version_number'])
          print('QUARTZ_DEPENDENCIES='+json.dumps(info['dependencies'],ensure_ascii=False))
          for f in info['files']:
              if not f.get('primary') and len(info['files'])>1:
                  continue
              name=f['filename']; b=get(f['url'])
              print('QUARTZ_FILENAME='+name)
              print('QUARTZ_SIZE='+str(len(b)))
              print('QUARTZ_SHA512='+hashlib.sha512(b).hexdigest())
              print('QUARTZ_SHA1='+hashlib.sha1(b).hexdigest())
              print('QUARTZ_RELEASE_SHA512='+str(f['hashes'].get('sha512')))
              print('QUARTZ_DOWNLOAD_URL='+f['url'])
              assert hashlib.sha512(b).hexdigest()==f['hashes']['sha512']
              assert hashlib.sha1(b).hexdigest()==f['hashes']['sha1']
              print('QUARTZ_ORIGINAL_JAR_HASH_VERIFIED=YES')
          PY
