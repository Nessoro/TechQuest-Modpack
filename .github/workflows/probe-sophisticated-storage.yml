name: Probe Sophisticated Storage compatibility
on:
  push:
    branches: [fix/micropatch-storage-ultimine-worldtier-033]
    paths: [.github/workflows/probe-sophisticated-storage.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare storage/core release metadata
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          url = 'https://api.modrinth.com/v2/project/hMlaZH8f/version?' + urllib.parse.urlencode(
            {'loaders': json.dumps(['neoforge']), 'game_versions': json.dumps(['1.21.1'])})
          req = urllib.request.Request(url,headers={'User-Agent':'TechQuest-MicroPatch-Compatibility/1.0'})
          with urllib.request.urlopen(req,timeout=75) as r:
            releases=json.load(r)
          latest=sorted([x for x in releases if x['version_type']=='release'],key=lambda x:x['date_published'],reverse=True)
          for obj in latest[:12]:
            selected=next((f for f in obj['files'] if f.get('primary')),obj['files'][0])
            print('STORAGE_VERSION',json.dumps({'name':obj['version_number'],'date':obj['date_published'],'id':obj['id'],
              'filename':selected['filename'],'sha512':selected['hashes'].get('sha512'),'dependencies':obj.get('dependencies')},
              ensure_ascii=False),flush=True)
          PY
