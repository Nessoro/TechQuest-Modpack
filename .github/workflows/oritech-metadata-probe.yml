name: Probe official Oritech 1.21.1 NeoForge metadata
on:
  pull_request:
    paths:
      - .github/workflows/oritech-metadata-probe.yml
permissions:
  contents: read
jobs:
  modrinth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Identify latest compatible release and required libraries
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path
          def get(u):
              request=urllib.request.Request(u,headers={"User-Agent":"TechQuest-Modpack/0.3.3 (github.com/Nessoro/TechQuest-Modpack)"})
              with urllib.request.urlopen(request, timeout=30) as resp: return json.load(resp)
          url="https://api.modrinth.com/v2/project/4sYI62kA/version?" + urllib.parse.urlencode({
              "loaders":json.dumps(["neoforge"]),"game_versions":json.dumps(["1.21.1"])
          })
          versions=get(url)
          print("COMPAT_RELEASE_COUNT="+str(len(versions)))
          for v in versions[:8]:print("COMPAT="+json.dumps({"id":v["id"],"number":v["version_number"],"type":v["version_type"],"published":v["date_published"],"title":v["name"]}))
          releases=[x for x in versions if x["version_type"]=="release"]
          assert releases, "No official 1.21.1 NeoForge stable release"
          v=max(releases, key=lambda x:x["date_published"])
          assert v["project_id"]=="4sYI62kA" and "neoforge" in v["loaders"] and "1.21.1" in v["game_versions"]
          files=v["files"]
          primary=[f for f in files if f.get("primary")] or files
          assert len(primary)==1, [f["filename"] for f in files]
          f=primary[0]
          print("SELECTED_PROJECT="+v["project_id"])
          print("SELECTED_VERSION_ID="+v["id"])
          print("SELECTED_VERSION="+v["version_number"])
          print("SELECTED_FILENAME="+f["filename"])
          print("SELECTED_SHA512="+f["hashes"]["sha512"])
          print("SELECTED_SHA1="+f["hashes"]["sha1"])
          print("SELECTED_SIZE="+str(f["size"]))
          print("SELECTED_DEPENDENCIES="+json.dumps(v.get("dependencies",[])))
          cfg=json.loads(Path("modlist.json").read_text(encoding="utf-8"))
          installed=set(cfg["modrinth_lock"])
          print("INSTALLED_REQUIRED_DEPS=")
          for dep in v.get("dependencies",[]):
              if dep["dependency_type"]=="required":
                  depid=dep.get("project_id")
                  print(json.dumps({"project_id":depid,"in_lock":depid in installed,
                                    "version_id":dep.get("version_id"),
                                    "filename":dep.get("file_name")}))
          print("PROJECT_LICENSE="+str(get("https://api.modrinth.com/v2/project/4sYI62kA").get("license")))
          for project in ("b1ZV3DIJ", "yAyrQXJ6"):
              p=get("https://api.modrinth.com/v2/project/"+project)
              vers=get("https://api.modrinth.com/v2/project/"+project+"/version?" + urllib.parse.urlencode({
                  "loaders":json.dumps(["neoforge"]),"game_versions":json.dumps(["1.21.1"])
              }))
              compatible=[x for x in vers if x.get("version_type")=="release"]
              print("EXTRA_PROJECT="+project+" TITLE="+p.get("title","?")+" LICENSE="+p.get("license",{}).get("id","?")+" RELEASE_COUNT="+str(len(compatible)))
              for x in compatible[:4]:
                  print("EXTRA_CANDIDATE="+json.dumps({"project":project,"number":x["version_number"],"version_id":x["id"],"published":x["date_published"]}))
              assert compatible, ("no release",project)
              v=max(compatible,key=lambda x:x["date_published"])
              f=[f for f in v["files"] if f.get("primary")] or v["files"]
              assert len(f)==1,(project,[x["filename"] for x in f])
              f=f[0]
              print("EXTRA_SELECTED="+json.dumps({"project":project,"version_id":v["id"],
                 "version":v["version_number"],"filename":f["filename"],"sha512":f["hashes"]["sha512"],
                 "sha1":f["hashes"]["sha1"],"size":f["size"],"dependencies":v.get("dependencies",[]),
                 "game_versions":v["game_versions"],"loaders":v["loaders"],
                 "client_side":p.get("client_side"),"server_side":p.get("server_side")}))
          PY
