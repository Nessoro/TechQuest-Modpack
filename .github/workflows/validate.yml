name: Validate repository
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test project and builder
        run: |
          python -m unittest discover -s tests -v
          python build_pack.py --help
      - name: Probe official Modrinth IWT artifact (temporary; no distribution)
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          id = 'CcRkmcRp'
          project = 'nQR8XALE'
          headers = {'User-Agent':'TechQuest-IWT-compatibility-probe/0.3.3'}
          def request(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=45)
          with request('https://api.modrinth.com/v2/version/' + id) as resp:
              version = json.load(resp)
          assert version['id'] == id and version['project_id'] == project
          assert '1.21.1' in version['game_versions'] and 'neoforge' in version['loaders']
          files = [f for f in version['files'] if f.get('primary')]
          assert len(files) == 1
          f = files[0]
          assert f['filename'] == 'interdimensionalwirelesstransmitter-neoforge-1.21.1-0.1.5.jar'
          assert f['url'].startswith('https://cdn.modrinth.com/data/' + project + '/versions/' + id + '/')
          print('IWT_FILENAME=' + f['filename'])
          print('IWT_SIZE=' + str(f['size']))
          print('IWT_SHA512=' + f['hashes']['sha512'])
          print('IWT_SHA1=' + f['hashes']['sha1'])
          print('IWT_DEPENDENCIES=' + json.dumps(version['dependencies'], sort_keys=True))
          with request(f['url']) as resp:
              blob = resp.read()
          assert len(blob) == f['size']
          assert hashlib.sha512(blob).hexdigest() == f['hashes']['sha512']
          assert hashlib.sha1(blob).hexdigest() == f['hashes']['sha1']
          print('IWT_ORIGINAL_JAR_HASH_VERIFIED=YES')
          PY
