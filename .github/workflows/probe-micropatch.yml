name: Probe micro-patch mod metadata
on:
  push:
    branches: [fix/micropatch-storage-ultimine-worldtier-033]
    paths:
      - scripts/probe_micropatch_sources.py
      - .github/workflows/probe-micropatch.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query public official publisher metadata only
        run: python scripts/probe_micropatch_sources.py
